<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <header>
        <nav class="navbar">

            <div class="logo">
                ShopEase
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cart.html">Cart 🛒</a></li>
            </ul>

        </nav>
    </header>


    <!-- Login -->

    <main class="login-page">

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p>Login to continue shopping.</p>


            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 ShopEase | Smart E-Commerce QA Platform
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
