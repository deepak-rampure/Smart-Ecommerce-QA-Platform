<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEase</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <header>
        <nav class="navbar">

            <div class="logo">
                ShopEase
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cart.html">Cart 🛒</a></li>
            </ul>

        </nav>
    </header>


    <!-- Checkout -->

    <main class="checkout-page">

        <h1>Checkout</h1>

        <div class="checkout-container">


            <!-- Customer Information -->

            <section class="checkout-section">

                <h2>Customer Information</h2>

                <form id="checkoutForm">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="checkoutEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="checkoutEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <h2 class="address-heading">
                        Delivery Address
                    </h2>


                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>


                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >


                    <label for="pincode">
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter PIN code"
                        required
                    >


                    <!-- Payment -->

                    <h2 class="address-heading">
                        Payment Method
                    </h2>

                    <div class="payment-options">

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                required
                            >
                            Cash on Delivery
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="upi"
                            >
                            UPI
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="card"
                            >
                            Credit / Debit Card
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn">

                        Place Order

                    </button>

                </form>

                <p id="checkoutMessage"></p>

            </section>


            <!-- Order Summary -->

            <section class="checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkoutItems">
                </div>

                <hr>

                <p>
                    Total Items:
                    <span id="checkoutTotalItems">0</span>
                </p>

                <p>
                    Total Amount:
                    ₹<span id="checkoutTotalPrice">0</span>
                </p>

            </section>

        </div>

    </main>


    <footer>

        <p>
            © 2026 ShopEase | Smart E-Commerce QA Platform
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
